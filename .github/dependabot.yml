# Weekly version-update PRs (policy: "Dependencies" in CLAUDE.md).
# - A release is proposed only after a 7-day cooldown; security updates do not wait.
# - Dev tooling minor and patch updates are grouped. lightweight-charts (the dashboard's only runtime package)
#   always comes alone, because a chart change needs a browser check. Majors come one by one.
# - The Bun runtime is bumped by hand, all together: Dockerfile, ci.yml `bun-version`, `@types/bun`.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-tooling:
        patterns: ["*"]
        exclude-patterns: ["lightweight-charts"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/bun"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
