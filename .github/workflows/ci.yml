name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3 # bumped by hand with the Dockerfile image and @types/bun (CLAUDE.md, Dependencies)
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
