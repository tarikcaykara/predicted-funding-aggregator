name: predicted-funding-aggregator

services:
  app:
    build: .
    image: predicted-funding-aggregator:${PFA_VERSION:-local}
    env_file: .env
    # The image sets the same paths, but env_file beats image ENV and a copied .env.example sets ./ paths.
    environment:
      DATA_FILE: /app/data/funding_rate.json
      HISTORY_FILE: /app/data/history.sqlite
    volumes:
      - data:/app/data
    ports:
      # Loopback only; put a TLS reverse proxy or tunnel in front to serve other machines.
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    # Bounded logs for long-running hosts.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
