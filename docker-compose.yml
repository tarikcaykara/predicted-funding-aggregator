name: predicted-funding-aggregator

services:
  app:
    build: .
    image: predicted-funding-aggregator
    env_file: .env
    # The image sets the same paths, but env_file beats image ENV and a copied .env.example sets ./ paths.
    environment:
      DATA_FILE: /app/data/funding_rate.json
      HISTORY_FILE: /app/data/history.sqlite
    volumes:
      - data:/app/data
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  data:
